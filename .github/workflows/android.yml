name: Build Naser IPTV APK

on:
  push:
    branches: [main]
    paths:
      - "NaserIPTV-AndroidStudio-v3.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Android project
        run: |
          test -f NaserIPTV-AndroidStudio-v3.zip
          mkdir -p source
          unzip -q NaserIPTV-AndroidStudio-v3.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Align Java and Kotlin JVM targets
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          marker = "    compileSdk = 35\n"
          block = marker + """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              if marker not in s:
                  raise SystemExit("Could not find compileSdk declaration in app/build.gradle.kts")
              s = s.replace(marker, block, 1)
              p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Naser-IPTV-debug-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
